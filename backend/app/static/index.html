<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>যা বলা হয়নি — ChatNovel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1c140e;
      --panel: #f3e6c8;
      --line: #c4a574;
      --maya: #8a3a28;
      --arjun: #4a5c3a;
      --text: #1a120c;
      --mute: #6e5840;
      --bubble-m: #efe0b8;
      --bubble-a: #e6d3a8;
      --gold: #8a3a28;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: "Noto Serif Bengali", "Noto Sans Bengali", serif; }
    body { display: grid; place-items: center; }
    .phone {
      width: min(430px, 100%);
      height: min(100dvh, 920px);
      background: var(--panel);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 0 8px #3a2416, 0 30px 80px #1c140ea8;
    }
    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: .75rem;
      align-items: center;
      padding: .7rem 1rem;
      border-bottom: 1px solid var(--line);
      background: #ead9b0;
    }
    .tools { display: flex; gap: .35rem; }
    .avs { display: flex; }
    .av {
      width: 36px; height: 36px; border-radius: 50%; overflow: hidden;
      border: 2px solid #8a3a28; margin-left: -8px; background: #3a2416;
    }
    .av:first-child { margin-left: 0; }
    .av img, .pav img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .row { display: flex; max-width: 88%; align-items: flex-end; gap: .4rem; }
    .row.second { align-self: start; }
    .row.first { align-self: end; flex-direction: row-reverse; }
    .pav { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex: none; background: #3a2416; border: 1px solid #8a3a28; }
    .who strong { display: block; font-size: .95rem; }
    .who small { color: var(--mute); }
    .ghost {
      background: transparent; color: var(--text); border: 1px solid var(--line);
      border-radius: 999px; padding: .35rem .7rem; cursor: pointer; font: inherit;
    }
    #thread {
      overflow: auto;
      padding: 1rem .9rem 1.2rem;
      display: flex; flex-direction: column; gap: .55rem;
      background:
        radial-gradient(600px 220px at 50% 0%, #fff6dc 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 27px, #e6d4a855 28px),
        var(--panel);
    }
    .marker {
      align-self: center; color: #5c3d24; font-size: .75rem;
      background: #d9c08a; border: 1px solid #b08950;
      padding: .25rem .8rem; border-radius: 4px; margin: .35rem 0;
      font-family: "Noto Serif Bengali", serif;
    }
    .bubble {
      padding: .65rem .85rem; line-height: 1.55;
      border-radius: 18px 18px 18px 5px;
      background: var(--bubble-a);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row.first .bubble { background: var(--bubble-m); border-radius: 18px 18px 5px 18px; }
    .nm { display: block; font-size: .7rem; margin-bottom: .12rem; }
    .row.second .nm { color: var(--arjun); }
    .row.first .nm { color: var(--maya); }
    .caret {
      display: inline-block; width: 2px; height: 1em; background: var(--arjun);
      margin-left: 1px; animation: blink 1s infinite; vertical-align: text-bottom;
    }
    @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
    .deleted { opacity: .65; font-style: italic; }
    .end {
      margin: 1rem auto 2rem; max-width: 340px; text-align: center;
      border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem;
      background: #efe0b8; display: none;
    }
    .end.show { display: grid; gap: .7rem; }
    .end h2 { font-family: "Noto Serif Bengali", serif; margin: 0; font-size: 1.15rem; }
    .end .line { color: var(--gold); }
    .end button, .cover button:not(.ghost) {
      background: var(--gold); color: #f3e6c8; border: 0; border-radius: 4px;
      padding: .7rem 1.1rem; font: inherit; font-weight: 700; cursor: pointer;
    }
    footer {
      border-top: 1px solid var(--line);
      padding: .55rem .7rem calc(.7rem + env(safe-area-inset-bottom));
      background: #ead9b0;
      display: grid; gap: .35rem;
    }
    .status { color: var(--mute); font-size: .78rem; min-height: 1.1em; }
    .composer {
      display: grid; grid-template-columns: 1fr auto; gap: .45rem; align-items: end;
    }
    #draft {
      min-height: 44px; max-height: 120px; overflow: auto;
      background: #f7eccf; border: 1px solid var(--line); border-radius: 4px;
      padding: .7rem .95rem; color: var(--text); line-height: 1.45;
    }
    #draft:empty::before { content: "Deb লিখছে…"; color: #8a7358; }
    .send {
      width: 44px; height: 44px; border-radius: 4px; border: 0;
      background: #d9c08a; color: var(--mute); font-size: 1.1rem;
    }
    .send.hot { background: var(--gold); color: #f3e6c8; }
    .cover {
      position: absolute; inset: 0; background:
        radial-gradient(500px 280px at 50% 20%, #fff6dc 0%, transparent 70%),
        var(--panel);
      display: grid; place-items: start center; padding: 1.2rem 1.1rem 2rem; text-align: center; z-index: 30;
      overflow: auto;
      pointer-events: auto;
    }
    .cover-inner { width: 100%; max-width: 380px; position: relative; z-index: 31; pointer-events: auto; }
    .cover.hidden { display: none; }
    .cover h1 { font-family: "Noto Serif Bengali", serif; font-size: 1.85rem; margin: .2rem 0; color: #6b2a1c; letter-spacing: .02em; }
    .cover p { color: var(--mute); line-height: 1.55; }
    .hint { font-size: .8rem; color: var(--mute); }
    .picks { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; margin: .35rem 0 .6rem; pointer-events: auto; position: relative; z-index: 32; }
    .chip {
      border: 1px solid var(--line); background: #efe0b8; color: var(--text);
      border-radius: 999px; padding: .4rem .85rem; font: inherit; cursor: pointer;
      pointer-events: auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .chip.on { background: var(--gold); color: #f3e6c8; }
    .slate {
      align-self: center; max-width: 92%; text-align: center;
      border: 1px solid #8a3a28; background: #3a2416; color: #f3e6c8;
      padding: .55rem .85rem; border-radius: 4px; margin: .4rem 0;
    }
    .slate strong { display: block; font-size: .82rem; letter-spacing: .06em; }
    .slate span { display: block; font-size: .72rem; color: #e6d3a8; margin-top: .28rem; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="cover" id="cover">
      <div class="cover-inner">
        <p class="hint">গল্পের ধরন</p>
        <div class="picks" id="tropes"></div>
        <p class="hint">কাল</p>
        <div class="picks" id="eras"></div>
        <p class="hint">তাপ</p>
        <div class="picks" id="heats"></div>
        <h1 id="cover-title">যা বলা হয়নি</h1>
        <p id="cover-blurb">১৮৫০, কলকাতা। Deb আর Visha-এর গোপন চিঠি।</p>
        <p id="plot-status" class="hint"></p>
        <p id="resume-hint" class="hint"></p>
        <p><button type="button" id="build-btn">গল্প গড়ুন</button></p>
        <p><button type="button" id="start-btn">চিঠি খুলুন</button></p>
        <p><button type="button" class="ghost" id="reset-btn">শুরু থেকে</button></p>
      </div>
    </div>

    <header>
      <div class="avs">
        <span class="av" id="pic-deb"></span>
        <span class="av" id="pic-visha"></span>
      </div>
      <div class="who">
        <strong>Deb · Visha</strong>
        <small id="sub">অধ্যায় ১</small>
      </div>
      <div class="tools">
        <button class="ghost" type="button" id="mute-btn" aria-pressed="false">নিরব</button>
        <button class="ghost" type="button" id="pause-btn">থামো</button>
      </div>
    </header>

    <div id="thread" aria-live="polite"></div>

    <div class="end" id="end">
      <p class="hint" id="end-kicker">অধ্যায় শেষ</p>
      <h2 id="end-title"></h2>
      <p class="line" id="end-line"></p>
      <button type="button" id="next-btn">পরের অধ্যায়</button>
    </div>

    <footer>
      <div class="status" id="status"></div>
      <div class="composer">
        <div id="draft"></div>
        <button class="send" type="button" id="send" aria-label="send">➤</button>
      </div>
    </footer>
    <audio id="theme" src="/static/theme.mp3" loop preload="auto"></audio>
  </div>

<script>
const KEY = "chatnovel.progress";
const PLOT_KEY = "chatnovel.plot";
const FIRST = "Deb";
const SECOND = "Visha";
const $ = (id) => document.getElementById(id);
const thread = $("thread");
const draft = $("draft");
const sendBtn = $("send");
const statusEl = $("status");
const pauseBtn = $("pause-btn");
const muteBtn = $("mute-btn");
const theme = $("theme");
const MUTE_KEY = "chatnovel.muted";
theme.volume = 0.38;

function isMuted() {
  return localStorage.getItem(MUTE_KEY) === "1";
}
function applyMute() {
  const on = isMuted();
  theme.muted = on;
  muteBtn.textContent = on ? "সুর" : "নিরব";
  muteBtn.setAttribute("aria-pressed", on ? "true" : "false");
}
function startTheme() {
  applyMute();
  theme.play().catch(() => {});
}
applyMute();

let STORY = null;
let PRESETS = {
  tropes: [
    { id: "slow_burn", label: "যা বলা হয়নি" },
    { id: "enemies_to_lovers", label: "শত্রু থেকে প্রেম" },
    { id: "arranged", label: "ঘরের বিয়ে" },
    { id: "second_chance", label: "দ্বিতীয় সুযোগ" },
  ],
  eras: [
    { id: "calcutta_1850", label: "গোপন চিঠি, ১৮৫০" },
    { id: "modern", label: "আজকের কলকাতা" },
    { id: "sarat_era", label: "পুরনো সামাজিক রোমান্স" },
  ],
  heats: [
    { id: "restrained", label: "সংযত" },
    { id: "erotic", label: "কামুক · ১৮+" },
  ],
  defaults: { trope: "slow_burn", era: "calcutta_1850", heat: "restrained" },
};
let pick = { trope: "slow_burn", era: "calcutta_1850", heat: "restrained" };
let state = load();
let paused = false;
let skipTick = false;
let playing = false;
let chapterDone = false;

function load() {
  try {
    return JSON.parse(localStorage.getItem(KEY)) || { chapter: 0, index: 0, log: {}, photos: null, tension: 0 };
  } catch {
    return { chapter: 0, index: 0, log: {}, photos: null, tension: 0 };
  }
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}
function photos() {
  state.photos = state.photos || {};
  state.photos.Deb = "/static/deb.png";
  state.photos.Visha = "/static/visha.png";
  return state.photos;
}
function setPhoto(el, name) {
  const img = document.createElement("img");
  img.alt = name;
  img.src = photos()[name];
  el.replaceChildren(img);
}
function applyPhotos() {
  setPhoto($("pic-deb"), FIRST);
  setPhoto($("pic-visha"), SECOND);
}
function avatarEl(name) {
  const wrap = document.createElement("span");
  wrap.className = "pav";
  const img = document.createElement("img");
  img.alt = name;
  img.src = photos()[name];
  wrap.appendChild(img);
  return wrap;
}
function msgs() {
  const k = String(state.chapter);
  state.log = state.log || {};
  state.log[k] = state.log[k] || [];
  return state.log[k];
}
function glyphs(text) {
  if (Intl.Segmenter) {
    return [...new Intl.Segmenter("bn", { granularity: "grapheme" }).segment(text)].map((s) => s.segment);
  }
  return [...text];
}
function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}
function scrollBottom() {
  thread.scrollTo({ top: thread.scrollHeight, behavior: "smooth" });
}
function chapter() {
  return STORY.chapters[state.chapter];
}
function isFirst(msg) {
  return msg.speaker === FIRST || msg.speaker === "Maya";
}
function addMarker(text) {
  const p = document.createElement("p");
  p.className = "marker";
  p.textContent = text;
  thread.appendChild(p);
}
function addSlate(msg) {
  const d = document.createElement("div");
  d.className = "slate";
  const k = document.createElement("strong");
  k.textContent = msg.slugline || (msg.body || "").split("\n")[0] || "দৃশ্য";
  d.appendChild(k);
  const rest = [msg.blocking, msg.action].filter(Boolean).join(" — ")
    || (msg.body || "").split("\n").slice(1).join(" ");
  if (rest) {
    const s = document.createElement("span");
    s.textContent = rest;
    d.appendChild(s);
  }
  thread.appendChild(d);
}
function addBubble(msg, body, withCaret) {
  const who = isFirst(msg) ? FIRST : SECOND;
  const row = document.createElement("div");
  row.className = `row ${isFirst(msg) ? "first" : "second"}`;
  row.appendChild(avatarEl(who));
  const b = document.createElement("div");
  b.className = "bubble" + (msg.kind === "deleted" ? " deleted" : "");
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = who;
  const t = document.createElement("span");
  t.textContent = body;
  b.appendChild(nm);
  b.appendChild(t);
  if (withCaret) {
    const c = document.createElement("span");
    c.className = "caret";
    b.appendChild(c);
  }
  row.appendChild(b);
  thread.appendChild(row);
  return { row, t, b };
}
function setChrome() {
  const ch = chapter();
  $("sub").textContent = `অধ্যায় ${ch.n} · ${ch.title}`;
}
function restoreSeen() {
  thread.innerHTML = "";
  const list = msgs();
  for (let i = 0; i < state.index; i++) {
    const m = list[i];
    if (!m) continue;
    if (m.kind === "action") addSlate(m);
    else if (m.kind === "scene_marker") addMarker(m.body);
    else addBubble(m, m.body, false);
  }
  scrollBottom();
}

function keyDelay(ch, speaker) {
  const pace = speaker === FIRST ? 0.72 : 0.64;
  if (/[।!?…]/.test(ch)) return (260 + Math.random() * 420) * pace;
  if (/[,.—\-]/.test(ch)) return (130 + Math.random() * 180) * pace;
  if (ch === " " || ch === "\n") return (50 + Math.random() * 90) * pace;
  let ms = 105 + Math.random() * 115;
  if (Math.random() < 0.06) ms += 260 + Math.random() * 420;
  if (Math.random() < 0.22) ms *= 0.45;
  return ms * pace;
}
async function thinkThenType(text, speaker) {
  statusEl.textContent = `${speaker} লিখছে…`;
  const n = glyphs(text).length;
  await sleep(380 + Math.random() * 720 + Math.min(n * 8, 650));
}

async function typeIntoComposer(text) {
  const parts = glyphs(text);
  draft.textContent = "";
  sendBtn.classList.remove("hot");
  await thinkThenType(text, FIRST);
  for (let i = 0; i < parts.length; i++) {
    while (paused) await sleep(120);
    if (skipTick) { draft.textContent = text; skipTick = false; break; }
    draft.textContent += parts[i];
    await sleep(keyDelay(parts[i], FIRST));
  }
  sendBtn.classList.add("hot");
  await sleep(220 + Math.random() * 240);
  skipTick = false;
}

async function typeIntoBubble(msg) {
  const parts = glyphs(msg.body);
  await thinkThenType(msg.body, SECOND);
  const { t, b } = addBubble(msg, "", true);
  const caret = b.querySelector(".caret");
  for (let i = 0; i < parts.length; i++) {
    while (paused) await sleep(120);
    if (skipTick) { t.textContent = msg.body; skipTick = false; break; }
    t.textContent += parts[i];
    scrollBottom();
    await sleep(keyDelay(parts[i], SECOND));
  }
  if (caret) caret.remove();
}

async function playOne(msg) {
  draft.textContent = "";
  sendBtn.classList.remove("hot");
  if (msg.kind === "action") {
    statusEl.textContent = "";
    addSlate(msg);
    scrollBottom();
    await sleep(500 + Math.random() * 280);
    return;
  }
  if (msg.kind === "scene_marker") {
    statusEl.textContent = "";
    addMarker(msg.body);
    scrollBottom();
    await sleep(400 + Math.random() * 280);
    return;
  }
  if (msg.kind === "deleted") {
    const who = isFirst(msg) ? FIRST : SECOND;
    statusEl.textContent = `${who} একটি পাতা পোড়াচ্ছে…`;
    await sleep(520 + Math.random() * 380);
    addBubble(msg, msg.body, false);
  } else if (isFirst(msg)) {
    await typeIntoComposer(msg.body);
    addBubble(msg, msg.body, false);
  } else {
    await typeIntoBubble(msg);
  }
  draft.textContent = "";
  sendBtn.classList.remove("hot");
  statusEl.textContent = "";
  scrollBottom();
  await sleep(380 + Math.random() * 480 + Math.min((msg.body || "").length * 12, 800));
}

async function fetchMore() {
  const list = msgs();
  const recent = list.filter((m) => m.kind !== "scene_marker" && m.kind !== "action").slice(-16);
  const r = await fetch("/v1/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chapter: state.chapter,
      already: list.length,
      recent,
      tension: state.tension || 0,
      bible: STORY.bible,
      chapters: STORY.chapters,
      era_rules: STORY.era_rules,
    }),
  });
  const data = await r.json();
  const incoming = data.messages || [];
  if (typeof data.tension === "number") state.tension = data.tension;
  if (incoming.length) {
    state.log[String(state.chapter)] = list.concat(incoming);
    save();
  }
  return data;
}

async function play() {
  if (playing) return;
  playing = true;
  chapterDone = false;
  $("end").classList.remove("show");
  setChrome();
  if (STORY.llm === false && !msgs().length && chapter().messages?.length) {
    state.log[String(state.chapter)] = chapter().messages.slice();
    save();
  }
  while (true) {
    while (paused) await sleep(150);
    const list = msgs();
    if (state.index < list.length) {
      await playOne(list[state.index]);
      state.index += 1;
      save();
      continue;
    }
    if (chapterDone) break;
    statusEl.textContent = "কথা আসছে…";
    const data = await fetchMore();
    chapterDone = !!data.chapter_complete;
    if (!(data.messages || []).length) break;
  }
  playing = false;
  showEnd();
}

function showEnd() {
  const ch = chapter();
  $("end-kicker").textContent = `অধ্যায় ${ch.n} শেষ`;
  $("end-title").textContent = ch.title;
  $("end-line").textContent = `“${ch.closing}”`;
  $("next-btn").textContent = state.chapter < STORY.chapters.length - 1 ? "পরের অধ্যায়" : "গল্পের শুরু";
  $("end").classList.add("show");
  scrollBottom();
}

function startChat() {
  $("cover").classList.add("hidden");
  startTheme();
  restoreSeen();
  play();
}

$("start-btn").onclick = startChat;
$("reset-btn").onclick = () => {
  const keep = state.photos;
  state = { chapter: 0, index: 0, log: {}, photos: keep, tension: 0 };
  save();
  localStorage.removeItem(PLOT_KEY);
  $("resume-hint").textContent = "";
  $("plot-status").textContent = "নতুন গল্প গড়ুন।";
  $("start-btn").textContent = "চিঠি খুলুন";
  $("cover").classList.remove("hidden");
};
$("build-btn").onclick = buildPlot;
$("next-btn").onclick = () => {
  if (state.chapter < STORY.chapters.length - 1) {
    state.chapter += 1;
    state.index = 0;
    state.tension = 0;
  } else {
    state = { chapter: 0, index: 0, log: {}, photos: state.photos, tension: 0 };
  }
  save();
  restoreSeen();
  play();
};
pauseBtn.onclick = () => {
  paused = !paused;
  pauseBtn.textContent = paused ? "চালাও" : "থামো";
};
muteBtn.onclick = () => {
  localStorage.setItem(MUTE_KEY, isMuted() ? "0" : "1");
  applyMute();
  if (!isMuted()) theme.play().catch(() => {});
};
thread.onclick = () => { skipTick = true; };
sendBtn.onclick = () => { skipTick = true; };

fetch("/v1/story")
  .then((r) => r.json())
  .then((data) => {
    STORY = data;
    applyPhotos();
    applyPlot(loadPlot() || data);
    if (state.chapter || state.index) {
      $("resume-hint").textContent = `থামানো ছিল অধ্যায় ${chapter().n}-এ।`;
      $("start-btn").textContent = "পড়ে চলুন";
    }
  })
  .catch(() => {
    $("cover-blurb").textContent = "গল্প লোড হয়নি। সার্ভার চালু আছে তো?";
    $("start-btn").disabled = true;
  });

fetch("/v1/presets")
  .then((r) => r.json())
  .then((data) => {
    PRESETS = {
      tropes: data.tropes || PRESETS.tropes,
      eras: data.eras || PRESETS.eras,
      heats: data.heats || PRESETS.heats,
      defaults: data.defaults || PRESETS.defaults,
    };
    const saved = loadPlot();
    pick.trope = saved?.trope || data.defaults?.trope || "slow_burn";
    pick.era = saved?.era || data.defaults?.era || "calcutta_1850";
    pick.heat = saved?.heat || data.defaults?.heat || "restrained";
    renderPicks();
  });

function loadPlot() {
  try {
    return JSON.parse(localStorage.getItem(PLOT_KEY) || "null");
  } catch {
    return null;
  }
}
function applyPlot(plot) {
  if (!plot) return;
  STORY = { ...STORY, ...plot };
  if (plot.title) $("cover-title").textContent = plot.title;
  if (plot.blurb) $("cover-blurb").textContent = plot.blurb;
}
function renderPicks() {
  paintPicks("tropes", PRESETS.tropes, "trope");
  paintPicks("eras", PRESETS.eras, "era");
  paintPicks("heats", PRESETS.heats, "heat");
}
function paintPicks(id, items, key) {
  const box = $(id);
  if (!box) return;
  box.innerHTML = "";
  for (const item of items || []) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (pick[key] === item.id ? " on" : "");
    b.dataset[key] = item.id;
    b.textContent = item.label;
    box.appendChild(b);
  }
}
$("cover").addEventListener("click", (ev) => {
  const chip = ev.target.closest(".chip");
  if (!chip) return;
  ev.preventDefault();
  ev.stopPropagation();
  if (chip.dataset.trope) pick.trope = chip.dataset.trope;
  if (chip.dataset.era) pick.era = chip.dataset.era;
  if (chip.dataset.heat) pick.heat = chip.dataset.heat;
  renderPicks();
});
renderPicks();
async function buildPlot() {
  const status = $("plot-status");
  const btn = $("build-btn");
  btn.disabled = true;
  status.textContent = "গল্প গড়া হচ্ছে…";
  try {
    const r = await fetch("/v1/plot", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(pick),
    });
    if (!r.ok) throw new Error("plot");
    const plot = await r.json();
    plot.trope = pick.trope;
    plot.era = pick.era;
    plot.heat = pick.heat;
    localStorage.setItem(PLOT_KEY, JSON.stringify(plot));
    applyPlot(plot);
    const keep = state.photos;
    state = { chapter: 0, index: 0, log: {}, photos: keep, tension: 0 };
    save();
    $("resume-hint").textContent = "";
    $("start-btn").textContent = "চিঠি খুলুন";
    status.textContent = "গল্প তৈরি। চিঠি খুলুন।";
  } catch {
    status.textContent = "গল্প গড়া যায়নি। আবার চেষ্টা করুন।";
  }
  btn.disabled = false;
}
</script>
</body>
